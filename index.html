    <!-- DOS MANOS -->

        />

    <div id="handRight" class="grab-hand">
      <svg viewBox="0 0 64 64">
        <path
          d="M20 29
             L20 14
             C20 11 22 9 25 9
             C28 9 30 11 30 14
             L30 28

             C10 29 13 29 15 31
             L20 36
             Z"
          fill="white"
          stroke="black"
          stroke-width="3"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <script>
      let images = [];
      let currentImage = 0;
      let button;

      const buttonWidth = 100;
      const buttonHeight = 50;

      const handDistance = 11;

      function preload() {
        images[0] = loadImage("01.png");
        images[1] = loadImage("02.png");
        images[2] = loadImage("03.png");
        images[3] = loadImage("04.png");
        images[4] = loadImage("05.png");
        images[5] = loadImage("06.png");
      }

      function setup() {
        createCanvas(windowWidth, windowHeight);

        button = createButton("touch");
        button.mouseOver(moveButton);
      }

      function draw() {
        background(220);

        if (images[currentImage]) {
          drawImageCover(images[currentImage]);
        }

        updateHands();
      }

      function updateHands() {
        const left = document.getElementById("handLeft");
        const right = document.getElementById("handRight");

        left.style.left = (mouseX - handDistance) + "px";
        left.style.top = mouseY + "px";

        right.style.left = (mouseX + handDistance) + "px";
        right.style.top = mouseY + "px";
      }

      function drawImageCover(img) {
        const imgRatio = img.width / img.height;
        const canvasRatio = width / height;

        let drawW;
        let drawH;

        if (canvasRatio > imgRatio) {
          drawW = width;
          drawH = width / imgRatio;
        } else {
          drawH = height;
          drawW = height * imgRatio;
        }

        const x = (width - drawW) / 2;
        const y = (height - drawH) / 2;

        image(img, x, y, drawW, drawH);
      }

      function moveButton() {
        const x = random(width - buttonWidth);
        const y = random(height - buttonHeight);

        button.size(buttonWidth, buttonHeight);
        button.position(x, y);
      }

      function mousePressed() {
        currentImage = (currentImage + 1) % images.length;
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }

      function keyPressed() {
        if (key === "s") {
          saveCanvas("imagen-" + currentImage, "png");
        }

        if (key === "a") {
          for (let i = 0; i < images.length; i++) {
            setTimeout(() => {
              clear();
              drawImageCover(images[i]);
              saveCanvas("imagen-" + i, "png");
            }, i * 800);
          }
        }
      }
    </script>

  </body>
